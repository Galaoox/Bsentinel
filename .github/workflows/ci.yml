name: CI Pipeline

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bsentinel_test
          POSTGRES_USER: bsentinel
          POSTGRES_PASSWORD: bsentinel_test_only
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Run linter (Ruff)
        run: |
          uv run ruff check .

      - name: Run full SQLite suite
        env:
          DATABASE_URL: sqlite+aiosqlite:///ci-sqlite.db
          APP_ENVIRONMENT: local
        run: |
          uv run pytest tests/ -q

      - name: Create isolated PostgreSQL test databases
        env:
          PGPASSWORD: bsentinel_test_only
        run: |
          psql -h 127.0.0.1 -p 55432 -U bsentinel -d bsentinel_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bulk_test'
          psql -h 127.0.0.1 -p 55432 -U bsentinel -d bsentinel_test -v ON_ERROR_STOP=1 -c 'CREATE DATABASE bsentinel_schedule_test'

      - name: Run full suite with mandatory PostgreSQL cases and coverage
        env:
          DATABASE_URL: postgresql+asyncpg://bsentinel:bsentinel_test_only@127.0.0.1:55432/bsentinel_test
          BULK_TEST_POSTGRES_URL: postgresql+asyncpg://bsentinel:bsentinel_test_only@127.0.0.1:55432/bulk_test
          SCHEDULE_TEST_POSTGRES_URL: postgresql+asyncpg://bsentinel:bsentinel_test_only@127.0.0.1:55432/bsentinel_schedule_test
          REQUIRE_TEST_POSTGRES: '1'
          APP_ENVIRONMENT: local
        run: |
          uv run pytest tests/ --cov=bsentinel --cov-report=xml --cov-report=term

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t bsentinel:${{ github.sha }} --target base .

      - name: Test Docker image
        run: |
          docker run --rm bsentinel:${{ github.sha }} python -c "import bsentinel; print('OK')"
